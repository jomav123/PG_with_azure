services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - flask --app app init-db && flask --app app run --host=0.0.0.0 --port=5000

  test-db:
    image: postgres:17-alpine
    profiles:
      - test
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_test_data:
  uploads:
