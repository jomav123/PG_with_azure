name: Build and Push to ACR
on:
push:
branches:
- main
jobs:
build-and-push:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
- name: Log in to ACR
uses: azure/docker-login@v1
with:
login-server: cacaproject.azurecr.io
username: ${{ secrets.REGISTRY_USERNAME }}
password: ${{ secrets.REGISTRY_PASSWORD }}
- name: Build and push Docker image
run: |
docker build -t cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }} .
docker push cacaproject.azurecr.io/pizzawsb-app:${{ github.sha }}
